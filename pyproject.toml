[project]
name = "pytest-datafaker"
version = "0.1.0"
description = "Pytest plugin with Faker class and fixture"
authors = [
    {name = "Oleg Burenkov",email = "burenkov.oleg@gmail.com"}
]
license = "MIT"
license-files = [ "LICENSE" ]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
readme = "README.md"
requires-python = ">=3.12"
packages = [
    { include = "pytest_datafaker", from = "src" }
]
dependencies = [
    "pytest (>=9.0.3,<10.0.0)",
    "faker (>=40.15.0,<41.0.0)"
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.12"
pytest = "^9.0.3"
mypy = "^2.0.0"
pytest-profiling = "^1.8.1"
pyproject-fmt = "^2.21.2"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "src",
]
format.docstring-code-format = true
lint.select = [
    "B",       # bugbear
    "D",       # pydocstyle
    "E",       # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "PGH004",  # pygrep-hooks - Use specific rule codes when using noqa
    "PIE",     # flake8-pie
    "PLC",     # pylint convention
    "PLE",     # pylint error
    "PLR",     # pylint refactor
    "PLR1714", # Consider merging multiple comparisons
    "PLW",     # pylint warning
    "PYI",     # flake8-pyi
    "RUF",     # ruff
    "T100",    # flake8-debugger
    "UP",      # pyupgrade
    "W",       # pycodestyle
]
lint.isort.combine-as-imports = true
lint.isort.lines-after-imports = 2
lint.isort.order-by-type = false
lint.pycodestyle.max-line-length = 120
lint.pydocstyle.convention = "pep257"
lint.pyupgrade.keep-runtime-typing = false

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true

[tool.pyproject-fmt]
indent = 4
max_supported_python = "3.14"

[tool.pytest]
minversion = "2.0"
addopts = [ "-rfEX", "-p", "pytester" ]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests/*.py",
]
python_classes = [
    "Test",
]
python_functions = [
    "test",
]
testpaths = [
    "tests/example_scripts",
]
norecursedirs = [
    "tests/example_scripts",
    ".*",
    "build",
    "dist",
]
strict = true
pytester_example_dir = "tests/example_scripts"

[project.entry-points.pytest11]
pytest_datafaker = "pytest_datafaker.plugin"
